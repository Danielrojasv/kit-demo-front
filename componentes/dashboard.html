<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de demo</title>
<link rel="stylesheet" href="comun.css">
<link rel="stylesheet" href="../vendor/leaflet/leaflet.css">
<style>
  main { display: grid; grid-template-columns: 1.4fr 1fr; grid-template-rows: auto auto 1fr; gap: 14px; padding: 16px 20px; height: calc(100vh - 60px); }
  #kpis { grid-column: 1 / 3; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .kpi .valor { font-size: 30px; font-weight: 700; color: var(--acento); font-variant-numeric: tabular-nums; }
  .kpi .nombre { color: var(--tenue); font-size: 13px; margin-top: 2px; }
  #zona-pipeline { grid-column: 1 / 3; }
  #mapa { height: 100%; min-height: 260px; border-radius: 8px; }
  #feed { overflow-y: auto; max-height: 100%; }
  .evento { border-left: 3px solid var(--acento); background: var(--carta); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; animation: entrar .35s ease; }
  .evento.alta { border-left-color: var(--rojo); }
  .evento.media { border-left-color: var(--ambar); }
  .evento .hora { color: var(--tenue); font-size: 12px; }
  @keyframes entrar { from { transform: translateX(14px); opacity: 0; } }
  #panel-mapa, #panel-feed { display: flex; flex-direction: column; min-height: 0; }
  #panel-feed .cab { display: flex; justify-content: space-between; align-items: baseline; }
</style>
</head>
<body>
<header class="barra">
  <h1>Panel de demo</h1>
  <a href="index.html">← catálogo</a>
  <span style="margin-left:auto"></span>
  <button class="accion" id="simular">Simular evento</button>
  <button class="accion" id="descargar" style="background:var(--carta);color:var(--texto);border:1px solid var(--borde)">Descargar reporte</button>
</header>
<main>
  <div id="kpis">
    <div class="panel kpi"><div class="valor" id="k1">0</div><div class="nombre">Eventos procesados hoy</div></div>
    <div class="panel kpi"><div class="valor" id="k2">0</div><div class="nombre">Resueltos automáticamente</div></div>
    <div class="panel kpi"><div class="valor" id="k3">0</div><div class="nombre">Esperando revisión humana</div></div>
    <div class="panel kpi"><div class="valor" id="k4">0</div><div class="nombre">Tiempo medio de respuesta (s)</div></div>
  </div>
  <div class="panel" id="zona-pipeline">
    <h2>Flujo en vivo</h2>
    <div id="pipeline"></div>
  </div>
  <div class="panel" id="panel-mapa">
    <h2>Sitios monitoreados</h2>
    <div id="mapa"></div>
  </div>
  <div class="panel" id="panel-feed">
    <div class="cab"><h2>Eventos entrando</h2></div>
    <div id="feed"></div>
  </div>
</main>
<script src="../vendor/leaflet/leaflet.js"></script>
<script src="../vendor/pdfmake.min.js"></script>
<script src="../vendor/vfs_fonts.js"></script>
<script type="module">
import { crearPipeline } from "./pipeline.js";
import { animarNumero } from "./kpi.js";

// --- datos falsos ---
const SITIOS = [
  { nombre: "Sitio A-1", lat: -41.52, lng: -72.95, estado: "ok" },
  { nombre: "Sitio A-2", lat: -41.71, lng: -73.10, estado: "ok" },
  { nombre: "Sitio B-1", lat: -41.95, lng: -72.78, estado: "alerta" },
  { nombre: "Sitio B-2", lat: -42.24, lng: -73.03, estado: "ok" },
  { nombre: "Sitio C-1", lat: -42.48, lng: -72.72, estado: "ok" },
];
const TIPOS = [
  { texto: "Lectura fuera de rango en sensor 3", nivel: "media" },
  { texto: "Registro manual recibido desde terreno", nivel: "baja" },
  { texto: "Umbral crítico superado", nivel: "alta" },
  { texto: "Documento nuevo cargado al repositorio", nivel: "baja" },
];

// --- mapa ---
const mapa = L.map("mapa", { zoomControl: false }).setView([-42.0, -72.9], 8);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenStreetMap",
}).addTo(mapa);
const marcadores = {};
for (const s of SITIOS) {
  marcadores[s.nombre] = L.circleMarker([s.lat, s.lng], {
    radius: 9,
    color: s.estado === "alerta" ? "#ff5d6c" : "#27c3e8",
    fillOpacity: 0.7,
  }).addTo(mapa).bindPopup(`<b>${s.nombre}</b><br>estado: ${s.estado}`);
}

// --- pipeline ---
const pipeline = crearPipeline(
  document.getElementById("pipeline"),
  ["Evento", "Clasificar", "Buscar contexto", "Decidir", "Notificar"],
);

// --- kpis ---
const kpis = { procesados: 0, autos: 0, humanos: 0 };
function pintarKpis(latencia) {
  animarNumero(document.getElementById("k1"), kpis.procesados);
  animarNumero(document.getElementById("k2"), kpis.autos);
  animarNumero(document.getElementById("k3"), kpis.humanos);
  if (latencia) animarNumero(document.getElementById("k4"), latencia, { decimales: 1 });
}

// --- feed + simulación de un evento cruzando el pipeline ---
let ocupado = false;
async function simularEvento() {
  if (ocupado) return;
  ocupado = true;
  const sitio = SITIOS[Math.floor(Math.random() * SITIOS.length)];
  const tipo = TIPOS[Math.floor(Math.random() * TIPOS.length)];
  const feed = document.getElementById("feed");
  const e = document.createElement("div");
  e.className = `evento ${tipo.nivel}`;
  e.innerHTML = `<div class="hora">${new Date().toLocaleTimeString("es-CL")} · ${sitio.nombre}</div>${tipo.texto}`;
  feed.prepend(e);
  marcadores[sitio.nombre].openPopup();

  const espera = (ms) => new Promise((r) => setTimeout(r, ms));
  pipeline.reiniciar();
  pipeline.activar(0, sitio.nombre); await espera(500); pipeline.completar(0);
  pipeline.activar(1, "nivel " + tipo.nivel); await espera(800); pipeline.completar(1, "nivel " + tipo.nivel);
  pipeline.activar(2, "buscando"); await espera(900); pipeline.completar(2, "3 documentos");
  pipeline.activar(3); await espera(700);
  const automatico = tipo.nivel !== "alta";
  if (automatico) { pipeline.completar(3, "automático"); kpis.autos++; }
  else { pipeline.fallar(3, "revisión humana"); kpis.humanos++; }
  pipeline.activar(4); await espera(400); pipeline.completar(4, automatico ? "resuelto" : "escalado");
  kpis.procesados++;
  pintarKpis(1.5 + Math.random() * 2);
  ocupado = false;
}
document.getElementById("simular").onclick = simularEvento;
setInterval(simularEvento, 7000);
simularEvento();

// --- reporte PDF ---
document.getElementById("descargar").onclick = () => {
  pdfMake.createPdf({
    content: [
      { text: "Reporte de eventos", style: "titulo" },
      { text: new Date().toLocaleString("es-CL"), margin: [0, 0, 0, 12], color: "#666" },
      {
        table: {
          widths: ["*", "auto", "auto"],
          body: [
            ["Indicador", "Valor", "Nota"],
            ["Eventos procesados", String(kpis.procesados), "jornada en curso"],
            ["Resueltos automáticamente", String(kpis.autos), ""],
            ["Esperando revisión humana", String(kpis.humanos), "requieren acción"],
          ],
        },
      },
      { text: "Documento generado por el panel de demo con datos sintéticos.", margin: [0, 14, 0, 0], fontSize: 9, color: "#888" },
    ],
    styles: { titulo: { fontSize: 18, bold: true } },
  }).download("reporte-demo.pdf");
};
</script>
</body>
</html>
